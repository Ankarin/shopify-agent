<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobile Test</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: green !important;
    }
    .container {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      background: green;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }
    .text {
      color: white;
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 20px;
    }
    .button {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: black;
      color: white;
      border: 5px solid yellow;
      font-size: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="text">MOBILE TEST</div>
    <div class="button">💬</div>
    <div class="text" style="font-size: 16px; margin-top: 20px;">If you see GREEN, HTML renders on mobile!</div>
  </div>
</body>
</html>
